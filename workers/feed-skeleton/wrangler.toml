name = "friendly-feed-skeleton"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[routes]]
pattern = "friendly-feed.jason-edelman.org/*"
zone_name = "jason-edelman.org"

[[d1_databases]]
binding = "DB"
database_name = "friendly-feed"
database_id = "12f77c98-595b-4919-9555-a334e0948ad5"

[vars]
SERVICE_DID = "did:web:feeds.friendlyfeed.app"

# Optional: if set, /api/preview queries your own OpenSearch Serverless collection.
# If unset, preview falls back to Bluesky's public search API (fine for MVP).
# OPENSEARCH_URL = "https://<collection-id>.<region>.aoss.amazonaws.com"
# AWS_REGION     = "us-east-1"

# Secrets — set via `wrangler secret put <NAME>` (never commit values):
#   wrangler secret put INTERNAL_SECRET        # shared with Railway filter engine
#   wrangler secret put ADMIN_SECRET           # admin dashboard token
#   wrangler secret put ANTHROPIC_API_KEY      # Claude API key
#   wrangler secret put AWS_ACCESS_KEY_ID      # IAM key for OpenSearch Serverless (aoss)
#   wrangler secret put AWS_SECRET_ACCESS_KEY  # IAM secret for OpenSearch Serverless

# Cron for weekly agent refinement suggestions (Pro/Studio)
[triggers]
crons = ["0 9 * * 1"]  # Monday 9am UTC
